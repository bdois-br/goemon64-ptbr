name: Publish ptbr_font.c

on:
  push:
    paths:
      - '.github/workflows/publish-ptbr-font.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source file
        run: |
          mkdir -p src
          base64 -d .ptbr_upload/ptbr_font.c.gz.b64 | gzip -d > src/ptbr_font.c
          test "$(sha256sum src/ptbr_font.c | cut -d' ' -f1)" = "eb975b6eba7e485c31009a41326ef1ab494d0b862d00f6650bf16918b2bc6b15"
          rm -rf .ptbr_upload
          rm -f .github/workflows/publish-ptbr-font.yml
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica src/ptbr_font.c da build 0.8.52"
          git push
